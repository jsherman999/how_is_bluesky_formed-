<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caveman lineup</title>
<style>body{margin:0;background:#9fc3d6}canvas{display:block;width:100%}</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script type="module">
import { makeLook, drawCaveman, defaultPose } from '../js/caveman.js';
const ctx = document.getElementById('c').getContext('2d');
const poses = ['idle', 'talk', 'angry', 'cower', 'mob', 'push', 'walk', 'idle'];
function frame(ms) {
  const t = ms / 1000;
  ctx.fillStyle = '#b9d7e6'; ctx.fillRect(0, 0, 1600, 900);
  ctx.fillStyle = '#a89a86'; ctx.fillRect(0, 400, 1600, 50); ctx.fillRect(0, 850, 1600, 50);
  for (let i = 0; i < 8; i++) {
    const look = makeLook('did:plc:test' + i);
    const pose = defaultPose();
    pose.t = t;
    const kind = poses[i % poses.length];
    if (kind === 'talk') { pose.mouth = Math.abs(Math.sin(t * 9)); pose.armF = [0.6, -1.4]; }
    if (kind === 'angry') { pose.brow = 'angry'; pose.mouth = 0.7; pose.anger = 1; }
    if (kind === 'cower') { pose.brow = 'worried'; pose.sweat = 1; pose.squash = 0.88; pose.lean = 0.25; pose.armF = [-0.9, -2.2]; pose.armB = [-0.7, -2.0]; }
    if (kind === 'mob') { pose.brow = 'angry'; pose.weapon = true; pose.armF = [-1.9, -0.6]; pose.mouth = 0.5 + 0.5 * Math.sin(t * 6); pose.anger = 0.8; }
    if (kind === 'push') { pose.lean = 0.35; pose.armF = [-0.15, 0]; pose.armB = [-0.05, 0]; }
    if (kind === 'walk') { pose.walk = t * 9; pose.armF = [1.3 + Math.sin(t * 9) * 0.4, -0.3]; }
    ctx.save();
    ctx.translate(200 + (i % 4) * 400, i < 4 ? 420 : 870);
    ctx.scale(i % 2 ? -1 : 1, 1);
    drawCaveman(ctx, look, pose);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
